<!-- Pattern: admin-table — page header + tabs + toolbar with search/filters + data table -->
<section class="pf-v6-c-page__main-section pf-m-light">
  <div class="pf-v6-c-content">
    <h1>{{ADMIN_TITLE}}</h1>
    <p>{{ADMIN_DESCRIPTION}}</p>
  </div>
</section>

<!-- Tabs -->
<section class="pf-v6-c-page__main-section pf-m-light pf-m-no-padding" style="padding:0 var(--pf-t--global--spacer--md);">
  <div class="pf-v6-c-tabs" id="admin-tabs">
    <ul class="pf-v6-c-tabs__list" role="tablist">
      {{ADMIN_TABS}}
    </ul>
  </div>
</section>

<!-- Table section -->
<section class="pf-v6-c-page__main-section">
  <div id="admintab-primary" class="admin-tab-content">
    <!-- Toolbar -->
    <div class="pf-v6-c-toolbar" style="margin-bottom:var(--pf-t--global--spacer--sm);">
      <div class="pf-v6-c-toolbar__content">
        <div class="pf-v6-c-toolbar__content-section" style="display:flex;gap:var(--pf-t--global--spacer--sm);align-items:center;flex-wrap:wrap;">
          <div class="pf-v6-c-toolbar__item" style="flex:1;min-width:200px;max-width:300px;">
            <div class="pf-v6-c-search-input">
              <div class="pf-v6-c-search-input__bar">
                <span class="pf-v6-c-search-input__text">
                  <span class="pf-v6-c-search-input__icon">
                    <svg fill="currentColor" height="1em" width="1em" viewBox="0 0 512 512"><path d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376c-34.4 25.2-76.8 40-122.7 40C93.1 416 0 322.9 0 208S93.1 0 208 0S416 93.1 416 208zM208 352a144 144 0 1 0 0-288 144 144 0 1 0 0 288z"/></svg>
                  </span>
                  <input class="pf-v6-c-search-input__text-input" type="text" placeholder="{{SEARCH_PLACEHOLDER}}" aria-label="{{SEARCH_ARIA_LABEL}}" id="admin-search" oninput="filterAdminTable()">
                </span>
              </div>
            </div>
          </div>
          {{TOOLBAR_FILTERS}}
          <div class="pf-v6-c-toolbar__item" style="margin-left:auto;">
            <span id="admin-item-count" style="font-size:var(--pf-t--global--font--size--sm);color:var(--pf-t--global--text--color--subtle);">{{ITEM_COUNT}}</span>
          </div>
        </div>
      </div>
    </div>

    <table class="pf-v6-c-table pf-m-grid-md" role="grid" aria-label="{{TABLE_ARIA_LABEL}}">
      <thead class="pf-v6-c-table__thead">
        <tr class="pf-v6-c-table__tr" role="row">
          {{TABLE_HEADERS}}
        </tr>
      </thead>
      <tbody class="pf-v6-c-table__tbody" id="admin-table-body">{{TABLE_BODY}}</tbody>
    </table>
  </div>

  {{ADDITIONAL_TABS}}
</section>

{{CONTENT_SCRIPTS}}
