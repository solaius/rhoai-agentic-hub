<!-- Pattern: detail — breadcrumb + title + two-column layout (sections + sidebar) -->
<!-- Breadcrumb -->
<div style="padding:16px 24px 0;">
  <nav class="pf-v6-c-breadcrumb" aria-label="Breadcrumb">
    <ol class="pf-v6-c-breadcrumb__list" role="list">
      <li class="pf-v6-c-breadcrumb__item">
        <a href="#" class="pf-v6-c-breadcrumb__link" onclick="{{BREADCRUMB_PARENT_ACTION}}">{{BREADCRUMB_PARENT}}</a>
      </li>
      <li class="pf-v6-c-breadcrumb__item">
        <span class="pf-v6-c-breadcrumb__item-divider">
          <svg fill="currentColor" height="1em" width="1em" viewBox="0 0 256 512"><path d="M246.6 233.4c12.5 12.5 12.5 32.8 0 45.3l-160 160c-12.5 12.5-32.8 12.5-45.3 0s-12.5-32.8 0-45.3L178.7 256 41.4 118.6c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0l160 160z"/></svg>
        </span>
        <span class="pf-v6-c-breadcrumb__link pf-m-current" id="breadcrumb-current">{{BREADCRUMB_CURRENT}}</span>
      </li>
    </ol>
  </nav>
</div>

<!-- Title area -->
<div style="padding:16px 24px;display:flex;align-items:center;justify-content:space-between;">
  <div style="display:flex;align-items:center;gap:16px;">
    <span class="page-title-icon" style="width:48px;height:48px;">
      {{TITLE_ICON}}
    </span>
    <div>
      <h1 id="detail-title" style="font-size:24px;font-weight:500;margin:0;">{{TITLE}}</h1>
      <div class="detail-badges" id="detail-badges" style="margin-top:4px;">{{BADGES}}</div>
    </div>
  </div>
  {{ACTION_BUTTON}}
</div>

<!-- Two-column layout -->
<div style="display:flex;gap:16px;padding:0 24px 24px;">
  <!-- Left column: content sections -->
  <div style="flex:1;min-width:0;">
    {{SECTIONS}}
  </div>

  <!-- Right column: sidebar -->
  <div class="detail-sidebar">
    <h2 class="detail-section-title" style="margin-bottom:24px;">{{SIDEBAR_TITLE}}</h2>
    <div id="detail-fields">{{SIDEBAR_FIELDS}}</div>
  </div>
</div>

{{CONTENT_SCRIPTS}}
