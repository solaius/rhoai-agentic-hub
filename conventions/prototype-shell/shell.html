<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RHOAI {{COMPONENT_NAME}} — Prototype {{VERSION}}</title>
  <link rel="stylesheet" href="https://unpkg.com/@patternfly/patternfly@6/patternfly.min.css">
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <!-- 1. PM Hub Banner (full width) -->
  <div class="proto-banner">
    <div class="proto-left">
      <span style="font-weight:700;">PM Hub</span>
      <span class="proto-sep">|</span>
      <span>{{COMPONENT_NAME}}</span>
      <span class="proto-sep">|</span>
      <span style="opacity:0.7;">Prototype</span>
    </div>
    <div class="proto-version">
      <select aria-label="Prototype version">
        <option value="{{VERSION}}" selected>{{VERSION}}</option>
      </select>
    </div>
  </div>

  <!-- 2. RHOAI Masthead (full width, above sidebar + content) -->
  <div class="rhoai-masthead">
    <div class="rhoai-masthead__left">
      <button class="icon-btn" type="button" aria-label="Toggle navigation" style="display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:4px;border:none;background:transparent;color:var(--pf-t--global--text--color--regular);cursor:pointer;">
        <svg fill="currentColor" height="1.1em" width="1.1em" viewBox="0 0 448 512"><path d="M0 96C0 78.3 14.3 64 32 64H416c17.7 0 32 14.3 32 32s-14.3 32-32 32H32C14.3 128 0 113.7 0 96zM0 256c0-17.7 14.3-32 32-32H416c17.7 0 32 14.3 32 32s-14.3 32-32 32H32c-17.7 0-32-14.3-32-32zM448 416c0 17.7-14.3 32-32 32H32c-17.7 0-32-14.3-32-32s14.3-32 32-32H416c17.7 0 32 14.3 32 32z"/></svg>
      </button>
      <a class="rhoai-masthead__brand" href="#" onclick="return false;">
        <img src="assets/RHOAI.svg" alt="Red Hat OpenShift AI" height="36" style="display:block;">
      </a>
    </div>
    <div class="rhoai-masthead__right">
      <button class="icon-btn" type="button" aria-label="Notifications"><svg fill="currentColor" height="1em" width="1em" viewBox="0 0 448 512"><path d="M224 0c-17.7 0-32 14.3-32 32V49.9C119.5 61.4 64 124.2 64 200v33.4c0 45.4-15.5 89.5-43.8 124.9L5.3 377.2C1.8 381.8 0 387.2 0 392.7C0 407.8 12.2 420 27.3 420H420.7c15.1 0 27.3-12.2 27.3-27.3c0-5.5-1.8-10.9-5.3-15.4l-14.9-18.9C399.5 322.9 384 278.8 384 233.4V200c0-75.8-55.5-138.6-128-150.1V32c0-17.7-14.3-32-32-32zm0 512c35.3 0 64-28.7 64-64H160c0 35.3 28.7 64 64 64z"/></svg></button>
      <button class="icon-btn" type="button" aria-label="Toggle contrast"><svg fill="currentColor" height="1em" width="1em" viewBox="0 0 512 512"><path d="M448 256c0-106-86-192-192-192V448c106 0 192-86 192-192zM0 256a256 256 0 1 1 512 0A256 256 0 1 1 0 256z"/></svg></button>
      <button class="icon-btn" type="button" aria-label="Toggle dark mode"><svg fill="currentColor" height="1em" width="1em" viewBox="0 0 384 512"><path d="M223.5 32C100 32 0 132.3 0 256S100 480 223.5 480c60.6 0 115.5-24.2 155.8-63.4c5-4.9 6.3-12.5 3.1-18.7s-10.1-9.7-17-8.5c-9.8 1.7-19.8 2.6-30.1 2.6c-96.9 0-175.5-78.8-175.5-176c0-65.8 36-123.1 89.3-153.3c6.1-3.5 9.2-10.5 7.7-17.3s-7.3-11.9-14.3-12.5c-6.3-.5-12.6-.8-19-.8z"/></svg></button>
      <button class="user-avatar" type="button" aria-label="User menu"><span class="avatar-circle">AI</span><span>AI Engineer</span></button>
    </div>
  </div>

  <!-- 3. App body (sidebar + content side by side) -->
  <div class="app-body">
    <div class="app-sidebar">
      {{NAV}}
    </div>
    <div class="app-content">
      {{CONTENT}}
    </div>
  </div>

  {{SCRIPTS}}
</body>
</html>
